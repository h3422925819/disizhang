<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试测试 - 第5章子图绘制</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 10px; }
        #output { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .chart-container { width: 100%; height: 200px; margin: 10px 0; border: 1px solid #ddd; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <h1>调试测试页面</h1>
    
    <div class="debug-section">
        <h2>1. 数据源测试</h2>
        <button onclick="testDataFactory()">测试工厂数据</button>
        <button onclick="testDataClimate()">测试气候数据</button>
        <button onclick="testDataSales()">测试销售数据</button>
        <button onclick="testDataMixed()">测试混合数据</button>
        <div id="output"></div>
    </div>
    
    <div class="debug-section">
        <h2>2. 图表类型测试</h2>
        <button onclick="testChartType('bar')">测试柱状图</button>
        <button onclick="testChartType('line')">测试折线图</button>
        <button onclick="testChartType('pie')">测试饼图</button>
        <div id="chart-output"></div>
    </div>
    
    <div class="debug-section">
        <h2>3. 布局测试</h2>
        <button onclick="testLayout()">测试2x2布局</button>
        <div id="layout-output"></div>
    </div>

    <script>
        // 模拟数据生成函数
        function generateFactoryData() {
            return {
                production: [
                    {department: '生产一部', output: 4500, quality: 92},
                    {department: '生产二部', output: 3800, quality: 88},
                    {department: '生产三部', output: 5200, quality: 95}
                ],
                monthly: [
                    {month: '1月', production: 15000, cost: 30000},
                    {month: '2月', production: 18000, cost: 35000}
                ]
            };
        }

        function generateClimateData() {
            return {
                hourly: [
                    {time: '00:00', temperature: 22.5, humidity: 65},
                    {time: '01:00', temperature: 22.1, humidity: 67}
                ],
                daily: [
                    {day: '周一', high: 28, low: 20},
                    {day: '周二', high: 30, low: 22}
                ]
            };
        }

        function generateSalesData() {
            return {
                quarterly: [
                    {quarter: 'Q1', revenue: 80000, profit: 20000},
                    {quarter: 'Q2', revenue: 95000, profit: 25000}
                ],
                products: [
                    {product: '产品A', sales: 5000, profit: 1000},
                    {product: '产品B', sales: 3000, profit: 800}
                ]
            };
        }

        function generateMixedData() {
            return {
                categories: [
                    {name: '类别A', value1: 100, value2: 80},
                    {name: '类别B', value1: 150, value2: 120}
                ],
                comparison: [
                    {series1: 10, series2: 8},
                    {series1: 15, series2: 12}
                ]
            };
        }

        let chartsData = {};

        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<br>' + message;
            console.log(message);
        }

        function testDataFactory() {
            chartsData.factory = generateFactoryData();
            log('工厂数据生成: ' + JSON.stringify(chartsData.factory, null, 2));
        }

        function testDataClimate() {
            chartsData.climate = generateClimateData();
            log('气候数据生成: ' + JSON.stringify(chartsData.climate, null, 2));
        }

        function testDataSales() {
            chartsData.sales = generateSalesData();
            log('销售数据生成: ' + JSON.stringify(chartsData.sales, null, 2));
        }

        function testDataMixed() {
            chartsData.mixed = generateMixedData();
            log('混合数据生成: ' + JSON.stringify(chartsData.mixed, null, 2));
        }

        function getDataForChart(data) {
            log('处理数据结构: ' + Object.keys(data));
            
            if (data.production && Array.isArray(data.production)) {
                return {
                    xData: data.production.map(item => item.department),
                    yData: data.production.map(item => item.output),
                    seriesName: '产量'
                };
            } else if (data.monthly && Array.isArray(data.monthly)) {
                return {
                    xData: data.monthly.map(item => item.month),
                    yData: data.monthly.map(item => item.production || item.temperature || item.revenue || 0),
                    seriesName: '月数据'
                };
            } else if (data.hourly && Array.isArray(data.hourly)) {
                return {
                    xData: data.hourly.map(item => item.time),
                    yData: data.hourly.map(item => item.temperature),
                    seriesName: '温度'
                };
            } else if (data.daily && Array.isArray(data.daily)) {
                return {
                    xData: data.daily.map(item => item.day),
                    yData: data.daily.map(item => item.high || 0),
                    seriesName: '最高温度'
                };
            } else if (data.quarterly && Array.isArray(data.quarterly)) {
                return {
                    xData: data.quarterly.map(item => item.quarter),
                    yData: data.quarterly.map(item => item.revenue),
                    seriesName: '收入'
                };
            } else if (data.categories && Array.isArray(data.categories)) {
                return {
                    xData: data.categories.map(item => item.name),
                    yData: data.categories.map(item => item.value1),
                    seriesName: '数值'
                };
            } else {
                return {
                    xData: ['A', 'B', 'C'],
                    yData: [100, 200, 150],
                    seriesName: '默认数据'
                };
            }
        }

        function testChartType(chartType) {
            const chartOutput = document.getElementById('chart-output');
            chartOutput.innerHTML = '';
            
            const chartTypes = ['factory', 'climate', 'sales', 'mixed'];
            const layoutType = 'grid';
            
            for (let i = 0; i < 4; i++) {
                const dataSource = chartTypes[i];
                const data = chartsData[dataSource];
                
                if (!data) {
                    chartOutput.innerHTML += '<p>数据源 ' + dataSource + ' 不存在</p>';
                    continue;
                }
                
                const chartData = getDataForChart(data);
                log('图表类型 ' + chartType + ' 数据源 ' + dataSource + ' 结果: ' + JSON.stringify(chartData));
                
                // 创建图表容器
                const container = document.createElement('div');
                container.className = 'chart-container';
                container.id = 'test-chart-' + i;
                chartOutput.appendChild(container);
                
                // 创建图表
                const chart = echarts.init(container);
                let option;
                
                if (chartType === 'bar') {
                    option = {
                        xAxis: { type: 'category', data: chartData.xData },
                        yAxis: { type: 'value' },
                        series: [{ type: 'bar', data: chartData.yData }]
                    };
                } else if (chartType === 'line') {
                    option = {
                        xAxis: { type: 'category', data: chartData.xData },
                        yAxis: { type: 'value' },
                        series: [{ type: 'line', data: chartData.yData }]
                    };
                } else if (chartType === 'pie') {
                    option = {
                        series: [{
                            type: 'pie',
                            data: chartData.xData.map((name, i) => ({ name, value: chartData.yData[i] }))
                        }]
                    };
                }
                
                chart.setOption(option);
            }
        }

        function testLayout() {
            const layoutOutput = document.getElementById('layout-output');
            layoutOutput.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const chartType = 'line'; // 固定为折线图
                const chartData = {
                    xData: ['A', 'B', 'C'],
                    yData: [100, 200, 150]
                };
                
                // 创建图表容器
                const container = document.createElement('div');
                container.className = 'chart-container';
                container.id = 'layout-chart-' + i;
                container.style.cssText = 'width: 48%; height: 200px; margin: 1%; display: inline-block;';
                layoutOutput.appendChild(container);
                
                // 创建图表
                const chart = echarts.init(container);
                const option = {
                    xAxis: { type: 'category', data: chartData.xData },
                    yAxis: { type: 'value' },
                    series: [{ type: chartType, data: chartData.yData }]
                };
                
                chart.setOption(option);
            }
        }

        // 页面加载完成后初始化
        window.onload = function() {
            log('调试页面加载完成');
        };
    </script>
</body>
</html>
