<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能验证测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
        .result { margin: 10px 0; padding: 10px; }
        .pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        iframe { width: 100%; height: 600px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>第5章子图绘制功能验证</h1>
    
    <div class="test-section">
        <h2>1. 测试简化版本核心功能</h2>
        <p>请在下方iframe中测试以下功能：</p>
        <ol>
            <li>选择"折线图"→是否所有4个图表都显示为折线图？</li>
            <li>选择"柱状图"→是否所有4个图表都显示为柱状图？</li>
            <li>切换不同数据源→是否所有图表都能正常显示数据？</li>
            <li>点击"测试当前状态"→控制台是否有正确的调试信息？</li>
        </ol>
        
        <button onclick="testInNewWindow()">在新窗口打开简化版本</button>
        <button onclick="openSimpleIndex()">嵌入简化版本</button>
        
        <div id="test-result" class="result info">请测试完成后填写结果</div>
        
        <iframe id="test-frame" src="simple-index.html"></iframe>
        
        <div>
            <h3>测试结果记录：</h3>
            <button onclick="recordResult('折线图测试', 'pass')">折线图测试通过</button>
            <button onclick="recordResult('折线图测试', 'fail')">折线图测试失败</button>
            
            <button onclick="recordResult('数据源测试', 'pass')">数据源测试通过</button>
            <button onclick="recordResult('数据源测试', 'fail')">数据源测试失败</button>
            
            <button onclick="generateReport()">生成测试报告</button>
        </div>
        
        <div id="results-log"></div>
    </div>

    <script>
        let testResults = {};
        
        function openSimpleIndex() {
            document.getElementById('test-frame').src = 'simple-index.html';
            document.getElementById('test-result').innerHTML = '简化版本已加载，请在上方iframe中测试';
        }
        
        function testInNewWindow() {
            window.open('simple-index.html', 'testWindow', 'width=1200,height=800');
        }
        
        function recordResult(testName, result) {
            if (!testResults[testName]) {
                testResults[testName] = [];
            }
            testResults[testName].push({
                result: result,
                timestamp: new Date().toLocaleString()
            });
            
            updateResultsDisplay();
            
            const resultDiv = document.getElementById('test-result');
            resultDiv.className = `result ${result === 'pass' ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `${testName}: ${result === 'pass' ? '✅ 通过' : '❌ 失败'} (${new Date().toLocaleTimeString()})`;
        }
        
        function updateResultsDisplay() {
            const logDiv = document.getElementById('results-log');
            let html = '<h3>测试结果记录：</h3>';
            
            Object.keys(testResults).forEach(testName => {
                html += `<div class="result">`;
                html += `<strong>${testName}:</strong><br>`;
                testResults[testName].forEach(record => {
                    const icon = record.result === 'pass' ? '✅' : '❌';
                    html += `${icon} ${record.result} (${record.timestamp})<br>`;
                });
                html += `</div>`;
            });
            
            logDiv.innerHTML = html;
        }
        
        function generateReport() {
            const report = {
                testDate: new Date().toISOString(),
                tests: testResults,
                summary: {
                    totalTests: Object.keys(testResults).length,
                    passedTests: Object.values(testResults).filter(results => 
                        results.some(r => r.result === 'pass')
                    ).length,
                    failedTests: Object.values(testResults).filter(results => 
                        results.some(r => r.result === 'fail')
                    ).length
                }
            };
            
            const reportText = JSON.stringify(report, null, 2);
            
            // 创建下载链接
            const blob = new Blob([reportText], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 初始化
        window.onload = function() {
            document.getElementById('test-result').innerHTML = '请在上方iframe中测试简化版本功能';
        };
    </script>
</body>
</html>
